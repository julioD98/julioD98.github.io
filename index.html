<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leader picker</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.mjs"></script>
</head>
<body>
    <section class="content">
        <div class="picker">
            <ul class="list-leader" id="leaders">
                <li class="name-leader">Julio</li>
                <li class="name-leader">Bayona</li>
                <li class="name-leader">Pantera</li>
                <li class="name-leader">Princesa</li>
                <li class="name-leader">Leo</li>
                <li class="name-leader">Inge</li>
                <li class="name-leader">Lopera</li>
                <li class="name-leader">Durango</li>
                <li class="name-leader">Daniel</li>
            </ul>
            <button class="pick-leader" id="pick">
                Elegir <span class="front">punta</span> y <span class="back">cola</span>
            </button>
            <button class="pick-leader" id="share">
                descargar
            </button>
        </div>
    </section>
    <script src="./libs/html-to-image.min.js"></script>
</body>
</html>
